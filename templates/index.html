<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GoodWe Smart Charging</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>GoodWe Smart Charging</h1>
        <p>Sistema Inteligente de Gerenciamento de Recarga</p>
    </header>


    <main>

        <section class="card">

            <h2>Nova Sessão de Recarga</h2>

            <form id="formSessao">

                <label>ID da sessão</label>
                <input type="number" id="id" min="1" required>


                <label>Modelo</label>

                <select id="modelo" required>
                    <option value="BYD">BYD</option>
                    <option value="BMW">BMW</option>
                    <option value="Renault">Renault</option>
                </select>


                <label>Bateria atual (%)</label>
                <input type="number" id="bateria_atual" min="0" max="100" required>


                <label>Bateria alvo (%)</label>
                <input type="number" id="bateria_alvo" min="1" max="100" required>


                <label>Tipo de carregamento</label>

                <select id="tipo" required>
                    <option value="Padrão">Padrão</option>
                    <option value="Premium">Premium</option>
                </select>


                <label>Hora de início</label>
                <input type="number" id="hora_inicio" min="0" max="23" required>


                <button type="submit">
                    Iniciar Recarga
                </button>

            </form>

            <p id="mensagem"></p>

        </section>


        <section class="card">

            <h2>Buscar Sessão</h2>

            <input
                type="number"
                id="idBusca"
                placeholder="Digite o ID"
            >

            <button onclick="buscarSessao()">
                Buscar
            </button>

            <div id="resultadoBusca"></div>

        </section>


        <section class="card">

            <h2>Sessões Registradas</h2>

            <div class="botoes">

                <button onclick="ordenar('id')">
                    Ordenar por ID
                </button>

                <button onclick="ordenar('energia')">
                    Ordenar por Energia
                </button>

                <button onclick="ordenar('custo')">
                    Ordenar por Custo
                </button>

                <button onclick="ordenar('tempo')">
                    Ordenar por Tempo
                </button>

            </div>


            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Veículo</th>
                        <th>Tipo</th>
                        <th>Energia</th>
                        <th>Tempo</th>
                        <th>Custo</th>
                    </tr>

                </thead>

                <tbody id="tabelaSessoes"></tbody>

            </table>

        </section>


        <section class="card">

            <h2>Estatísticas da Estação</h2>

            <button onclick="carregarEstatisticas()">
                Atualizar Estatísticas
            </button>

            <div id="estatisticas"></div>

        </section>

    </main>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
